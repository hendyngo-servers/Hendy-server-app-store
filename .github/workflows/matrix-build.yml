name: Matrix Build
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  detect-native-projects:
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.check.outputs.android }}
      ios: ${{ steps.check.outputs.ios }}
      windows: ${{ steps.check.outputs.windows }}
      macos: ${{ steps.check.outputs.macos }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        shell: bash
        run: |
          test -f apps/native/android/gradlew && echo 'android=true' >> "$GITHUB_OUTPUT" || echo 'android=false' >> "$GITHUB_OUTPUT"
          find apps/native/ios -name '*.xcodeproj' -o -name '*.xcworkspace' 2>/dev/null | grep -q . && echo 'ios=true' >> "$GITHUB_OUTPUT" || echo 'ios=false' >> "$GITHUB_OUTPUT"
          find apps/native/windows -name '*.sln' -o -name '*.csproj' 2>/dev/null | grep -q . && echo 'windows=true' >> "$GITHUB_OUTPUT" || echo 'windows=false' >> "$GITHUB_OUTPUT"
          find apps/native/macos -name '*.xcodeproj' -o -name '*.xcworkspace' 2>/dev/null | grep -q . && echo 'macos=true' >> "$GITHUB_OUTPUT" || echo 'macos=false' >> "$GITHUB_OUTPUT"
  android:
    needs: detect-native-projects
    if: needs.detect-native-projects.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: '21' }
      - uses: android-actions/setup-android@v4
      - name: Restore signing key
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_B64" ]; then echo "$ANDROID_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.keystore"; echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"; fi
      - run: chmod +x apps/native/android/gradlew && apps/native/android/gradlew -p apps/native/android assembleRelease bundleRelease
      - uses: actions/upload-artifact@v7
        with: { name: android-release, path: 'apps/native/android/**/build/outputs/**/*.{apk,aab}', if-no-files-found: error }
  ios:
    needs: detect-native-projects
    if: needs.detect-native-projects.outputs.ios == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Find Xcode project
        id: project
        run: echo "path=$(find apps/native/ios -name '*.xcodeproj' -maxdepth 5 | head -1)" >> "$GITHUB_OUTPUT"
      - name: Build iOS archive (signing requires correctly provisioned project/certificates)
        run: xcodebuild -project "${{ steps.project.outputs.path }}" -scheme "${{ vars.IOS_SCHEME }}" -configuration Release -archivePath "$RUNNER_TEMP/HendyApp.xcarchive" archive CODE_SIGNING_ALLOWED=NO
      - uses: actions/upload-artifact@v7
        with: { name: ios-archive, path: '${{ runner.temp }}/HendyApp.xcarchive', if-no-files-found: error }
  windows:
    needs: detect-native-projects
    if: needs.detect-native-projects.outputs.windows == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build .NET app
        shell: pwsh
        run: |
          $project = Get-ChildItem apps/native/windows -Recurse -Include *.sln,*.csproj | Select-Object -First 1
          if (-not $project) { throw 'No native Windows project found.' }
          dotnet publish $project.FullName -c Release -o "$env:RUNNER_TEMP\HendyWindows"
      - uses: actions/upload-artifact@v7
        with: { name: windows-release, path: '${{ runner.temp }}\HendyWindows\**', if-no-files-found: error }
  macos:
    needs: detect-native-projects
    if: needs.detect-native-projects.outputs.macos == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Find Xcode project
        id: project
        run: echo "path=$(find apps/native/macos -name '*.xcodeproj' -maxdepth 5 | head -1)" >> "$GITHUB_OUTPUT"
      - run: xcodebuild -project "${{ steps.project.outputs.path }}" -scheme "${{ vars.MACOS_SCHEME }}" -configuration Release -archivePath "$RUNNER_TEMP/HendyMac.xcarchive" archive CODE_SIGNING_ALLOWED=NO
      - uses: actions/upload-artifact@v7
        with: { name: macos-archive, path: '${{ runner.temp }}/HendyMac.xcarchive', if-no-files-found: error }
  report-missing-projects:
    needs: detect-native-projects
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Native targets are only built when corresponding source projects exist under apps/native/. Signing/notarization must be configured before distributing production binaries.'
