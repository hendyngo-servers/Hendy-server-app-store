name: Secrets Schema Integrity
on:
  push:
    branches: [main]
    paths: ["packages/types/src/secrets.ts", ".env.example", ".github/workflows/secrets-sync.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.20.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - name: Verify exactly 26 allowlisted key names
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const s = fs.readFileSync("packages/types/src/secrets.ts", "utf8");
          const block = s.match(/SECRET_KEYS = \[(.*?)\] as const/s)?.[1] ?? "";
          const keys = [...block.matchAll(/"([A-Z0-9_]+)"/g)].map(x => x[1]);
          if (keys.length !== 26 || new Set(keys).size !== 26) {
            console.error(`Expected 26 unique keys; found ${keys.length}`);
            process.exit(1);
          }
          console.log(`Schema OK: ${keys.length} unique key names`);
          NODE
      - name: Explain non-readable secret model
        run: echo 'GitHub Actions secret values cannot be read back through the API. Use the Access-protected Admin API to submit values; it encrypts them with GitHub public key before saving.'
