name: Trigger Render Deploy
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["src/**", "index.html", "server.js", "package.json", "render.yaml"]
permissions:
  contents: read
jobs:
  deploy:
    if: ${{ secrets.RENDER_DEPLOY_HOOK_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trigger Render deploy hook
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: curl --fail --silent --show-error --request POST "$DEPLOY_HOOK"
