name: Deploy Cloudflare Workers
on:
  push:
    branches: [main]
    paths:
      - "workers/**"
      - "packages/types/**"
      - "automation/auto-patcher-rules.json"
      - "migrations/**"
      - ".github/workflows/deploy-workers.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-workers-production
  cancel-in-progress: false
jobs:
  deploy:
    name: Deploy ${{ matrix.worker }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - worker: edge-router
            config: workers/edge-router/wrangler.toml
          - worker: backend-api
            config: workers/backend-api/wrangler.toml
          - worker: ota-manifest-server
            config: workers/ota-manifest-server/wrangler.toml
          - worker: self-healing-bot
            config: workers/self-healing-bot/wrangler.toml
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.20.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - name: Validate required Cloudflare resource IDs
        shell: bash
        run: |
          if grep -q 'REPLACE_WITH_' "${{ matrix.config }}"; then
            echo 'The Worker config still contains resource-ID placeholders.'
            echo 'Create D1/KV resources and replace REPLACE_WITH_* IDs before deploying.'
            exit 1
          fi
      - name: Deploy Worker
        run: pnpm exec wrangler deploy --config "${{ matrix.config }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
