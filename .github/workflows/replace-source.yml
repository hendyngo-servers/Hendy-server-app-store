name: Replace legacy source with HendyAppStore

on:
  push:
    branches:
      - main
    paths:
      - ".bootstrap/**"
      - ".github/workflows/replace-source.yml"

permissions:
  contents: write

concurrency:
  group: hendystore-source-replacement
  cancel-in-progress: false

jobs:
  replace-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and validate source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part*.b64 > /tmp/hendyappstore.tar.gz.b64
          python - <<'PY'
          import base64
          import pathlib
          import tarfile

          encoded_path = pathlib.Path("/tmp/hendyappstore.tar.gz.b64")
          encoded = encoded_path.read_text(encoding="ascii")
          archive_bytes = base64.b64decode(encoded, validate=True)
          archive_path = pathlib.Path("/tmp/hendyappstore.tar.gz")
          archive_path.write_bytes(archive_bytes)

          extract_path = pathlib.Path("/tmp/hendyappstore-source")
          extract_path.mkdir(parents=True, exist_ok=True)

          with tarfile.open(archive_path, mode="r:gz") as archive:
              members = archive.getmembers()
              files = [member for member in members if member.isfile()]
              names = {member.name for member in files}
              if len(files) != 87:
                  raise SystemExit(f"Expected 87 source files; found {len(files)}")
              required = {
                  "README.md",
                  "package.json",
                  "apps/web-user/src/App.tsx",
                  "apps/web-admin/src/App.tsx",
                  "workers/backend-api/src/index.ts",
                  "migrations/0001_init_schema.sql",
                  ".github/workflows/deploy-workers.yml",
              }
              missing = sorted(required - names)
              if missing:
                  raise SystemExit("Archive missing required files: " + ", ".join(missing))
              for member in members:
                  target = pathlib.PurePosixPath(member.name)
                  if target.is_absolute() or ".." in target.parts:
                      raise SystemExit(f"Unsafe archive path: {member.name}")
              archive.extractall(extract_path, filter="data")

          readme = (extract_path / "README.md").read_text(encoding="utf-8")
          if len(readme.splitlines()) < 400:
              raise SystemExit("README does not contain the expected expanded deployment guide")
          print(f"Validated {len(files)} files and {len(readme.splitlines())} README lines.")
          PY

      - name: Replace all legacy files in one commit
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/hendyappstore-source/README.md
          test -f /tmp/hendyappstore-source/apps/web-user/src/App.tsx
          test -f /tmp/hendyappstore-source/apps/web-admin/src/App.tsx

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          find . -mindepth 1 -maxdepth 1 ! -name ".git" -exec rm -rf -- {} +
          cp -a /tmp/hendyappstore-source/. .
          test ! -e .bootstrap
          git add --all
          git status --short
          git commit -m "Replace legacy source with HendyAppStore monorepo"
          git push origin HEAD:main
